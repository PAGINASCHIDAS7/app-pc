name: Build Analista Pro PC for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install desktop build tools
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Verify generated EXE files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe
          if ($files.Count -lt 2) {
            throw "No se generaron el instalador y el ejecutable portable."
          }
          $files | ForEach-Object { Write-Host $_.Name }

      - name: Upload Windows applications
        uses: actions/upload-artifact@v7
        with:
          name: Analista-Pro-PC-Windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
